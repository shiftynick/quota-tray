name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\QuotaTray.sln

      - name: Verify formatting
        run: dotnet format .\QuotaTray.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build .\QuotaTray.sln -c Release --no-restore

      - name: Test
        run: dotnet test .\QuotaTray.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
